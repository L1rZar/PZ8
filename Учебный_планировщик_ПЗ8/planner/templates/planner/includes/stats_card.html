<div class="card card-sm h-100">
    <div class="card-body">
        <div class="row align-items-center">
            <div class="col-auto">
                <span class="avatar bg-{{ color }} text-white"><i class="ti {{ icon }}"></i></span>
            </div>
            <div class="col">
                <div class="text-secondary">{{ label }}</div>
                <div class="h1 mb-0">{{ value }}</div>
            </div>
        </div>
    </div>
</div>
